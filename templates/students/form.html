{% extends "base.html" %}


{% block title %}

    {% if mode == "edit" %}
        Edit Student
    {% else %}
        Add Student
    {% endif %}

{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card">

            <div class="card-body">

                <h2 class="mb-4">

                    {% if mode == "edit" %}
                        Edit Student
                    {% else %}
                        Add Student
                    {% endif %}

                </h2>


                <form method="POST">

                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student.name if student else '' }}"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student.email if student else '' }}"
                            required
                        >

                    </div>


                    <!-- Age -->

                    <div class="mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            min="1"
                            max="120"
                            value="{{ student.age if student and student.age is not none else '' }}"
                        >

                    </div>


                    <!-- Course -->

                    <div class="mb-3">

                        <label class="form-label">
                            Course
                        </label>

                        <input
                            type="text"
                            name="course"
                            class="form-control"
                            value="{{ student.course if student else '' }}"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        {% if mode == "edit" %}
                            Update Student
                        {% else %}
                            Add Student
                        {% endif %}

                    </button>


                    <a
                        href="{{ url_for('students.index') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
